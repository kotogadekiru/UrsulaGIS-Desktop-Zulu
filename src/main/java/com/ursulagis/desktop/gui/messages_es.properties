Onboarding.hint.FIRST_PULVERIZATION_SHARED=Con una prescripción de pulverización lista, usa Compartir para subirla y obtener un QR.
Onboarding.hint.FIRST_SOIL_IMPORTED=Desde herramientas de Suelo, usa Importar para abrir un shapefile de suelo y configurarlo.
