Onboarding.hint.FIRST_RECORRIDA_IMPORTED=Importa un shapefile de recorrida desde las herramientas de Recorrida.
Onboarding.hint.FIRST_RECORRIDA_GUIDED_SHOWN=Abre una recorrida y usa Mostrar para ver el recorrido guiado en el mapa.
