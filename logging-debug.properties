# JUL debug config for UrsulaGIS (logger.fine ≈ DEBUG)
handlers=java.util.logging.ConsoleHandler
.level=INFO

java.util.logging.ConsoleHandler.level=FINE
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tH:%1$tM:%1$tS.%1$tL [%4$-7s] %2$s - %5$s%6$s%n

# App packages at FINE so logger.fine(...) shows up
com.ursulagis.level=FINE
