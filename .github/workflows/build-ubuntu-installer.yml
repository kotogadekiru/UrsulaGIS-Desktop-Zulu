name: Build Ubuntu Installer

on:
  push:
    branches: [ java17 ]
  pull_request:
    branches: [ java17 ]
  workflow_dispatch:

# Explicitly request permissions for creating releases
permissions:
  contents: write
  packages: write

env:
  PRIMARY_BUNDLE_ID: com.ursulagis.desktop.JFXMain
  APP_VERSION: 1.0.${{ github.run_number >= 1000 && '999' || github.run_number }}

jobs:
  build-ubuntu-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17 with JavaFX
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'liberica'
          java-package: jdk+fx
          cache: 'maven'

      - name: Build Linux installer (Maven)
        run: mvn -B clean install --file pom.xml
        env:
          MAVEN_OPTS: "-Dos.detected.name=linux"

      - name: Stage Linux DEB
        run: |
          mkdir -p installers
          for f in target/*.deb; do
            cp "$f" "installers/UrsulaGIS-Desktop_Zulu-${{ env.APP_VERSION }}_Linux_x64.deb"
          done

      - name: List build artifacts
        run: |
          echo "Staged installers:"
          ls -la installers/

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: UrsulaGIS-Desktop_Zulu-${{ env.APP_VERSION }}_Linux_x64_Installer
          path: installers/*.deb
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: UrsulaGIS-Desktop_Zulu_Linux_x64_Installer-${{ env.APP_VERSION }}
          name: Linux Installer Build - ${{ env.APP_VERSION }}
          body: |
            Linux DEB installer built from commit ${{ github.sha }}

            **Build Info:**
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Run: ${{ github.run_number }}
            - Date: ${{ github.event.head_commit.timestamp }}
          files: |
            installers/*.deb
          prerelease: true
          draft: false
