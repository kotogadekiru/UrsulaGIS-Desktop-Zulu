name: Build Windows Installer

on:
  push:
    branches: [ java17 ]
  pull_request:
    branches: [ java17 ]
  workflow_dispatch:

# Explicitly request permissions for creating releases
permissions:
  contents: write
  packages: write

env:
  PRIMARY_BUNDLE_ID: com.ursulagis.desktop.JFXMain
  APP_VERSION: 1.0.${{ github.run_number >= 1000 && '999' || github.run_number }}
jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Download Wix
        uses: i3h/download-release-asset@v1
        with:
          owner: wixtoolset
          repo: wix3
          tag: wix3112rtm
          file: wix311-binaries.zip
      
      - name: Decompress Wix
        uses: DuckSoft/extract-7z-action@v1.0
        with:
          pathSource: wix311-binaries.zip
          pathTarget: ./target/wix
      
      - name: Add Wix to Path
        run: echo "$HOME/target/wix" >> $GITHUB_PATH
      
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up JDK 17 with JavaFX
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'liberica'
          java-package: jdk+fx
          cache: 'maven'

      - name: Set up .NET 8 (Voyager 2 legacy runtime)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Voyager 2 legacy bundle
        shell: pwsh
        run: |
          $required = @(
            'libs/voyager2/native/CNHVoyager2JNI.dll',
            'libs/voyager2/native/CNHVoyager2Bridge.dll',
            'libs/voyager2/native/nethost.dll',
            'libs/voyager2/sdk/CNHVoyager2.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing Voyager 2 legacy file: $file. See docs/voyager2-legacy.md"
              exit 1
            }
          }
          Write-Host "Voyager 2 legacy bundle OK"
      
      - name: Build Windows Installer with Maven
        run: mvn -B clean install --file pom.xml
        env:
          # Activate Windows-specific profile
          MAVEN_OPTS: "-Dos.detected.name=windows"
      
      - name: Verify Voyager 2 bundle in installer input
        shell: pwsh
        run: |
          $bundled = @(
            'target/dependency/voyager2/native/CNHVoyager2JNI.dll',
            'target/dependency/voyager2/sdk/CNHVoyager2.dll'
          )
          foreach ($file in $bundled) {
            if (-not (Test-Path $file)) {
              Write-Error "Voyager 2 bundle was not copied into installer input: $file"
              exit 1
            }
          }
          Write-Host "Voyager 2 bundle present in target/dependency"

      - name: List build artifacts
        run: |
          echo "Build artifacts in target directory:"
          dir target
          echo "MSI files:"
          dir target\*.msi
          echo "Voyager 2 legacy bundle:"
          dir target\dependency\voyager2 /s
      
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: UrsulaGIS-Desktop_Zulu-${{ env.APP_VERSION }}_Win_x64_Installer
          path: target/*.msi
          retention-days: 30
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: UrsulaGIS-Desktop_Zulu_Win_x64_Installer-${{ env.APP_VERSION }}
          name: Windows Installer Build -${{ env.APP_VERSION }}
          body: |
            Windows MSI installer built from commit ${{ github.sha }}
            
            **Build Info:**
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Run: ${{ github.run_number }}
            - Date: ${{ github.event.head_commit.timestamp }}
          files: |
            target/*.msi
          prerelease: true
          draft: false
