name: Build Windows Installer

on:
  push:
    branches: [ java17 ]
  pull_request:
    branches: [ java17 ]
  workflow_dispatch:

# Explicitly request permissions for creating releases
permissions:
  contents: write
  packages: write

env:
  PRIMARY_BUNDLE_ID: com.ursulagis.desktop.JFXMain
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Wix
        uses: i3h/download-release-asset@v1
        with:
          owner: wixtoolset
          repo: wix3
          tag: wix3112rtm
          file: wix311-binaries.zip

      - name: Decompress Wix
        uses: DuckSoft/extract-7z-action@v1.0
        with:
          pathSource: wix311-binaries.zip
          pathTarget: ${{ runner.temp }}\wix

      - name: Add Wix to Path
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\wix"
        shell: pwsh

      - name: Set up JDK 17 x64 with JavaFX
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'liberica'
          java-package: jdk+fx
          architecture: x64
          cache: 'maven'

      - name: Build Windows x64 installer (Maven)
        run: mvn -B clean install --file pom.xml
        env:
          MAVEN_OPTS: "-Dos.detected.name=windows"

      - name: Stage x64 MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers | Out-Null
          Get-ChildItem -Path target -Filter *.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination "installers\UrsulaGIS-Desktop_Zulu-${{ env.APP_VERSION }}_Win_x64.msi"
          }

      - name: Set up JDK 17 x86 with JavaFX
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'liberica'
          java-package: jdk+fx
          architecture: x86
          cache: 'maven'

      - name: Build Windows x86 installer (Maven)
        run: mvn -B clean install --file pom.xml
        env:
          MAVEN_OPTS: "-Dos.detected.name=windows"

      - name: Stage x86 MSI
        shell: pwsh
        run: |
          Get-ChildItem -Path target -Filter *.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination "installers\UrsulaGIS-Desktop_Zulu-${{ env.APP_VERSION }}_Win_x86.msi"
          }

      - name: List build artifacts
        shell: pwsh
        run: |
          Write-Host "Staged installers:"
          Get-ChildItem installers

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: UrsulaGIS-Desktop_Zulu-${{ env.APP_VERSION }}_Win_x64_x86_Installers
          path: installers/*.msi
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: UrsulaGIS-Desktop_Zulu_Win_x64_x86_Installer-${{ env.APP_VERSION }}
          name: Windows Installer Build (x64 and x86) - ${{ env.APP_VERSION }}
          body: |
            Windows MSI installers (64-bit and 32-bit) built from commit ${{ github.sha }}

            **Build Info:**
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Run: ${{ github.run_number }}
            - Date: ${{ github.event.head_commit.timestamp }}
          files: |
            installers/*.msi
          prerelease: true
          draft: false
